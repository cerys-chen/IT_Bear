<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自嘲熊桌宠</title><link rel="stylesheet" href="pet.css"></head><body><main class="deskpet"><section class="pet-zone"><button id="bear" class="bear" title="点击切换动作；按住可拖动" aria-label="点击切换动作；按住可拖动"><img id="bearImage" alt="自嘲熊动作"></button><span id="bearResize" class="resize-handle bear-resize" aria-hidden="true"></span></section><aside id="paper" class="paper"><header class="paper-header"><div><h1 id="todoTitle">今日待办</h1><p id="summary">先写下来，再考虑拖延。</p></div><button id="hidePaper" class="hide-paper" title="隐藏待办" aria-label="隐藏待办">−</button></header><form id="form" class="todo-form"><input id="input" maxlength="120" autocomplete="off" placeholder="添加一件事"><button title="添加待办" aria-label="添加待办">＋</button></form><ul id="list" class="todo-list"></ul><div id="empty" class="empty">暂时没有待办</div><span id="paperResize" class="resize-handle paper-resize" aria-hidden="true"></span></aside><span id="speech" class="speech" role="status"></span><section id="settingsPanel" class="settings-panel" aria-hidden="true"><header><h2>桌宠设置</h2><button id="closeSettings" type="button" aria-label="关闭设置">×</button></header><label>熊宽度 <output id="bearWidthValue"></output><input id="bearWidthSetting" type="range" min="100" max="320"></label><label>熊高度 <output id="bearHeightValue"></output><input id="bearHeightSetting" type="range" min="120" max="360"></label><label>纸张宽度 <output id="paperWidthValue"></output><input id="paperWidthSetting" type="range" min="120" max="280"></label><label>纸张高度 <output id="paperHeightValue"></output><input id="paperHeightSetting" type="range" min="160" max="420"></label><label>中文字号 <output id="todoFontSizeValue"></output><input id="todoFontSizeSetting" type="range" min="10" max="20"></label><label>英文数字字号 <output id="latinFontSizeValue"></output><input id="latinFontSizeSetting" type="range" min="8" max="18"></label><label class="check-label"><input id="morningReminderSetting" type="checkbox">启动时显示昨日总结</label><label class="check-label"><input id="eveningReminderSetting" type="checkbox">下班前提醒未完成事项</label><label>提醒时间 <input id="eveningTimeSetting" type="time"></label><label class="check-label"><input id="standingReminderSetting" type="checkbox">定时提醒站立活动</label><label>站立提醒间隔 <output id="standingIntervalValue"></output><input id="standingIntervalSetting" type="range" min="15" max="240" step="15"></label><label class="check-label"><input id="autoStartSetting" type="checkbox">开机自动启动</label><label class="check-label"><input id="workdayEnabledSetting" type="checkbox">启用下班倒计时</label><label>下班时间口径 <select id="workdayModeSetting"><option value="auto">今天首次启动＋工时</option><option value="fixed">固定上下班时间</option></select></label><label>上班时间 <input id="workStartSetting" type="time"></label><label>下班时间 <input id="workEndSetting" type="time"></label><label>工作小时数 <output id="workHoursValue"></output><input id="workHoursSetting" type="range" min="4" max="12" step="0.5"></label><label class="check-label"><input id="lunchReminderSetting" type="checkbox">午饭时间提醒</label><label>午饭提醒时间 <input id="lunchTimeSetting" type="time"></label><label class="check-label"><input id="countdownReminderSetting" type="checkbox">下午与下班前后播报</label><label>下午播报时间 <input id="afternoonTimeSetting" type="time"></label><label>下班前提前 <output id="leadMinutesValue"></output><input id="leadMinutesSetting" type="range" min="5" max="120" step="5"></label><label class="check-label"><input id="overtimeReminderSetting" type="checkbox">下班后加班提醒</label><label>加班提醒间隔 <output id="overtimeIntervalValue"></output><input id="overtimeIntervalSetting" type="range" min="5" max="120" step="5"></label><label class="check-label"><input id="clickCountdownSetting" type="checkbox">点击熊时播报下班倒计时</label><button id="saveSettings" class="settings-save" type="button">保存设置</button></section><section id="reminderPanel" class="reminder-panel" aria-hidden="true"><h2 id="reminderTitle"></h2><p id="reminderSummary"></p><ul id="reminderList"></ul><div class="reminder-actions"><button id="carryoverButton" type="button">移到今天</button><button id="dismissReminder" type="button">稍后处理</button></div></section></main><script src="workday.js"></script><script src="pet.js"></script></body></html>
