<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自嘲熊桌宠</title><link rel="stylesheet" href="pet.css"></head><body><main class="deskpet"><section class="pet-zone"><button id="bear" class="bear" title="点击切换动作；按住可拖动" aria-label="点击切换动作；按住可拖动"><img id="bearImage" alt="自嘲熊动作"></button></section><aside id="paper" class="paper"><header class="paper-header"><div><h1 id="todoTitle">今日待办</h1><p id="summary">先写下来，再考虑拖延。</p></div><button id="hidePaper" class="hide-paper" title="隐藏待办" aria-label="隐藏待办">−</button></header><form id="form" class="todo-form"><input id="input" maxlength="120" autocomplete="off" placeholder="添加一件事"><button title="添加待办" aria-label="添加待办">＋</button></form><ul id="list" class="todo-list"></ul><div id="empty" class="empty">暂时没有待办</div></aside></main><script src="pet.js"></script></body></html>
