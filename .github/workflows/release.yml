name: Release Windows Portable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows portable app
        run: npx electron-builder --win portable --x64

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $portable = Get-ChildItem -LiteralPath dist -Filter "*.exe" | Select-Object -First 1
          if (-not $portable) {
            throw "Windows portable package was not generated."
          }

          gh release create "${{ github.ref_name }}" $portable.FullName `
            --title "JokeBear Deskpet ${{ github.ref_name }}" `
            --generate-notes
